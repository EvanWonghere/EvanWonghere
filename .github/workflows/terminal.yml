# git log 窗口：每 6 小时用最近的公开提交重画 assets/gitlog.svg
name: Terminal

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gitlog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Render git log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        # 暂时不想放上主页的仓库
        run: python3 tools/terminal_svg.py --gitlog "$OWNER" --hide rollback-arena --hide kb-search --hide InterviewQuestionBank

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gitlog.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update git log [skip ci]"
          git pull --rebase
          git push
