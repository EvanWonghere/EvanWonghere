# 像素猫：每 6 小时根据提交记录重画 dist/pet.svg
# 直接跑 YourTomo（prsdx/github-pet，MIT）的生成器，再用 tools/tidy_pet.py 去掉不适合这个主页的提示气泡
name: Pet

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check out YourTomo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: prsdx/github-pet
          ref: 988c75ee4f1ad5374d3ca692db4b307761776067 # v1.3.0
          path: .pet
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Draw the cat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PET_USER: ${{ github.repository_owner }}
          PET_TZ_OFFSET_MINUTES: "480"
          PET_ACCENT: "#4af626"
          PET_OUTPUT_DIR: ${{ github.workspace }}/dist
        run: |
          bun .pet/generate.ts
          python3 tools/tidy_pet.py dist/pet.svg dist/pet-light.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet && exit 0
          git commit -m "Update pet state [skip ci]"
          git pull --rebase
          git push
