  <text x="230.0" y="21.0" fill="#2f8f3a" font-size="13" text-anchor="middle" xml:space="preserve">fortune | beesay</text>
  <g filter="url(#glow)"><g opacity="0"><set attributeName="opacity" to="1" begin="0.10s" fill="freeze"/><text x="24.0" y="58.0" fill="#4af626" font-size="14" font-weight="bold" xml:space="preserve">evan@hive</text><text x="99.6" y="58.0" fill="#d7ffd9" font-size="14" xml:space="preserve">:~$</text></g><clipPath id="c1"><rect x="133.2" y="42.0" height="20" width="0"><animate attributeName="width" values="0.0;8.4;16.8;25.2;33.6;42.0;50.4;58.8;67.2;75.6;84.0;92.4;100.8;109.2;117.6;126.0;134.4;142.8;151.2;159.6;168.0;176.4;184.8;201.6" dur="1.68s" begin="0.40s" fill="freeze" calcMode="discrete"/></rect></clipPath><g clip-path="url(#c1)"><text x="133.2" y="58.0" fill="#d7ffd9" font-size="14" xml:space="preserve">fortune quotes | beesay</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.40s" fill="freeze"/><set attributeName="visibility" to="hidden" begin="2.38s" fill="freeze"/><rect x="133.2" y="46.0" width="8.4" height="16" fill="#4af626"><animate attributeName="x" values="133.2;141.6;150.0;158.4;166.8;175.2;183.6;192.0;200.4;208.8;217.2;225.6;234.0;242.4;250.8;259.2;267.6;276.0;284.4;292.8;301.2;309.6;318.0;326.4" dur="1.68s" begin="0.40s" fill="freeze" calcMode="discrete"/><animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" calcMode="discrete"/></rect></g><g opacity="0"><set attributeName="opacity" to="1" begin="2.38s" fill="freeze"/><rect x="24" y="76" width="412" height="128" rx="8" fill="#4af626" fill-opacity=".04" stroke="#4af626" stroke-dasharray="6 4"/><g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0123;0.1877;0.2000;1" dur="32.5s" begin="2.38s" repeatCount="indefinite"/><text x="42.0" y="110.0" fill="#d7ffd9" font-size="15" xml:space="preserve">也许头脑会出错，但是血脉不会。</text><text x="420.0" y="188.0" fill="#ffb000" font-size="12" text-anchor="end" xml:space="preserve">—— 中島 敦《光と風と夢》</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0123;0.1877;0.2000;1" dur="32.5s" begin="8.88s" repeatCount="indefinite"/><text x="42.0" y="110.0" fill="#d7ffd9" font-size="15" xml:space="preserve">从前，我不曾为自己的所做所为而后悔过，唯独对于</text><text x="42.0" y="134.0" fill="#d7ffd9" font-size="15" xml:space="preserve">没做的事，总是后悔莫及。</text><text x="420.0" y="188.0" fill="#ffb000" font-size="12" text-anchor="end" xml:space="preserve">—— 中島 敦《光と風と夢》</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0123;0.1877;0.2000;1" dur="32.5s" begin="15.38s" repeatCount="indefinite"/><text x="42.0" y="110.0" fill="#d7ffd9" font-size="15" xml:space="preserve">后来他“死了”，他那淡淡的形象也就消失，仿佛水消</text><text x="42.0" y="134.0" fill="#d7ffd9" font-size="15" xml:space="preserve">失在水中。</text><text x="420.0" y="188.0" fill="#ffb000" font-size="12" text-anchor="end" xml:space="preserve">—— Jorge Luis Borges《Las ruinas circulares》</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0123;0.1877;0.2000;1" dur="32.5s" begin="21.88s" repeatCount="indefinite"/><text x="42.0" y="110.0" fill="#d7ffd9" font-size="15" xml:space="preserve">人生一事无所为则嫌长，有所为则恨短。</text><text x="420.0" y="188.0" fill="#ffb000" font-size="12" text-anchor="end" xml:space="preserve">—— 中島 敦《山月記》</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0123;0.1877;0.2000;1" dur="32.5s" begin="28.38s" repeatCount="indefinite"/><text x="42.0" y="110.0" fill="#d7ffd9" font-size="15" xml:space="preserve">Because it&#x27;s there.</text><text x="420.0" y="188.0" fill="#ffb000" font-size="12" text-anchor="end" xml:space="preserve">—— George Mallory，被问为什么要登珠峰</text></g><text x="158.4" y="220.0" fill="#4af626" font-size="14" xml:space="preserve">\</text><text x="166.8" y="236.0" fill="#4af626" font-size="14" xml:space="preserve">\</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="2.38s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="1.4s" repeatCount="indefinite"/><g><animate attributeName="opacity" values="1;0" dur=".36s" repeatCount="indefinite" calcMode="discrete"/><text x="91.2" y="260.0" fill="#4af626" font-size="14" xml:space="preserve">        __     __</text><text x="91.2" y="276.0" fill="#4af626" font-size="14" xml:space="preserve">       /  \   /  \</text><text x="91.2" y="292.0" fill="#4af626" font-size="14" xml:space="preserve">       \   \ /   /</text><text x="91.2" y="308.0" fill="#4af626" font-size="14" xml:space="preserve">        &#x27;-._Y_.-&#x27;</text><text x="91.2" y="324.0" fill="#4af626" font-size="14" xml:space="preserve">    &gt;=[|||||](o.o)</text><text x="91.2" y="340.0" fill="#4af626" font-size="14" xml:space="preserve">        &quot; &quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur=".36s" repeatCount="indefinite" calcMode="discrete"/><text x="91.2" y="260.0" fill="#4af626" font-size="14" xml:space="preserve">      .--.__Y__.--.</text><text x="91.2" y="276.0" fill="#4af626" font-size="14" xml:space="preserve">      &#x27;--&#x27;     &#x27;--&#x27;</text><text x="91.2" y="292.0" fill="#4af626" font-size="14" xml:space="preserve">    &gt;=[|||||](o.o)</text><text x="91.2" y="308.0" fill="#4af626" font-size="14" xml:space="preserve">        &quot; &quot;</text></g></g></g></g>
