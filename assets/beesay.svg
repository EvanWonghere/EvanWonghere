<svg xmlns="http://www.w3.org/2000/svg" width="460" height="362" viewBox="0 0 460 362" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', monospace">
